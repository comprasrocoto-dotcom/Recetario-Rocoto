<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocoto · Recetario Profesional</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#0F172A;--bg2:#1E293B;--card:#111827;--card2:#172033;--border:#1E293B;--border2:#334155;
 --accent:#F97316;--accent2:#FB923C;--am:rgba(249,115,22,.12);--ag:rgba(249,115,22,.3);
 --tp:#FFFFFF;--ts:#CBD5E1;--tm:#64748B;--ok:#22C55E;--warn:#F59E0B;--err:#EF4444;--info:#3B82F6;
 --sw:280px
}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tp);-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
a{color:inherit;text-decoration:none}
.shell{display:flex;height:100vh;overflow:hidden}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sw);min-width:var(--sw);background:linear-gradient(180deg,#0c1424,#0F172A);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
.slogo{display:flex;align-items:center;gap:10px;padding:20px 20px 16px}
.slogo-icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px var(--ag)}
.slogo-text{font-size:21px;font-weight:800;letter-spacing:-.5px}
.slogo-v{font-size:10px;font-weight:700;color:var(--accent2);background:var(--am);padding:2px 7px;border-radius:20px;margin-left:auto}
.snav-scroll{flex:1;overflow-y:auto;padding:6px 12px 24px}
.ssec-label{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tm);padding:14px 10px 6px}
.nav{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;color:var(--ts);font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;transition:.15s;font-family:inherit;text-align:left}
.nav:hover{background:var(--bg2);color:var(--tp)}
.nav.on{background:var(--am);color:var(--accent2)}
.nav-ic{width:18px;height:18px;flex-shrink:0}
.nbadge{margin-left:auto;font-size:11px;font-weight:700;background:var(--bg2);color:var(--ts);padding:2px 8px;border-radius:20px}

/* Accordion families */
.fam{margin-bottom:4px}
.fam-head{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:none;background:transparent;color:var(--tp);font-size:13.5px;font-weight:700;letter-spacing:.3px;border-radius:10px;cursor:pointer;transition:.15s;font-family:inherit;text-transform:uppercase}
.fam-head:hover{background:var(--bg2)}
.fam-head.open{color:var(--accent2)}
.fam-emoji{font-size:17px}
.fam-chev{margin-left:auto;width:15px;height:15px;transition:transform .2s;color:var(--tm)}
.fam-head.open .fam-chev{transform:rotate(90deg);color:var(--accent2)}
.fam-count{font-size:10.5px;font-weight:700;color:var(--tm)}
.fam-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.fam-body.open{max-height:1500px}
.cat{width:100%;display:flex;align-items:center;gap:9px;padding:8px 12px 8px 30px;border:none;background:transparent;color:var(--ts);font-size:13px;font-weight:500;border-radius:9px;cursor:pointer;transition:.13s;font-family:inherit;text-align:left}
.cat:hover{background:var(--bg2);color:var(--tp)}
.cat.on{background:var(--am);color:var(--accent2);font-weight:700}
.cat-emoji{font-size:14px}
.cat-count{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--tm);background:var(--bg2);padding:1px 7px;border-radius:20px}
.cat.on .cat-count{background:var(--ag);color:var(--accent2)}

/* ===== MAIN ===== */
.main{flex:1;height:100vh;overflow-y:auto;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 30px;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--tm);font-weight:600}
.crumb b{color:var(--ts)}
.crumb .sep{margin:0 7px;color:var(--border2)}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:11px;padding:11px 14px 11px 40px;color:var(--tp);font-size:14px;font-family:inherit;outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--am)}
.search .sic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--tm)}
.content{padding:30px}

/* page header */
.phead{margin-bottom:24px}
.ptitle{font-size:30px;font-weight:800;letter-spacing:-.8px;display:flex;align-items:center;gap:12px}
.psub{font-size:14px;color:var(--ts);margin-top:5px}

/* family cards grid */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.fcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:18px;padding:24px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.fcard:hover{transform:translateY(-4px);border-color:var(--ag);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.fcard-emoji{font-size:38px;margin-bottom:14px}
.fcard-name{font-size:20px;font-weight:800;letter-spacing:-.4px}
.fcard-meta{font-size:13px;color:var(--ts);margin-top:6px}
.fcard-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fchip{font-size:11px;font-weight:600;color:var(--ts);background:var(--bg2);padding:4px 10px;border-radius:20px}
.fcard-arrow{position:absolute;top:24px;right:24px;color:var(--tm);transition:.18s}
.fcard:hover .fcard-arrow{color:var(--accent);transform:translateX(4px)}

/* recipe cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.rcard:hover{transform:translateY(-4px);border-color:var(--ag);box-shadow:0 14px 36px rgba(0,0,0,.4)}
.rcard-img{height:150px;background:linear-gradient(135deg,#1a2540,#0f1729);display:grid;place-items:center;position:relative;overflow:hidden}
.rcard-img img{width:100%;height:100%;object-fit:cover}
.rcard-img .ph{font-size:42px;opacity:.5}
.rcard-cat{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(15,23,42,.8);backdrop-filter:blur(6px);color:var(--accent2);padding:4px 9px;border-radius:20px}
.rcard-body{padding:15px 16px 16px}
.rcard-name{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.rcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--tm);font-weight:600}
.rcard-cost{color:var(--ok);font-weight:700}

/* ===== FICHA TECNICA ===== */
.ficha{max-width:920px;margin:0 auto}
.fic-back{display:inline-flex;align-items:center;gap:7px;color:var(--ts);font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border2);padding:8px 14px;border-radius:10px;cursor:pointer;margin-bottom:20px;font-family:inherit;transition:.15s}
.fic-back:hover{border-color:var(--accent);color:var(--accent2)}
.fic-hero{display:grid;grid-template-columns:340px 1fr;gap:26px;margin-bottom:30px}
@media(max-width:760px){.fic-hero{grid-template-columns:1fr}}
.fic-photo{height:260px;border-radius:18px;background:linear-gradient(135deg,#1a2540,#0f1729);overflow:hidden;display:grid;place-items:center;border:1px solid var(--border)}
.fic-photo img{width:100%;height:100%;object-fit:cover}
.fic-photo .ph{font-size:70px;opacity:.4}
.fic-info h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.fic-tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}
.fic-tag{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--am);color:var(--accent2)}
.fic-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fmeta{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px}
.fmeta-l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tm)}
.fmeta-v{font-size:16px;font-weight:700;margin-top:3px}
.fmeta-v.cost{color:var(--ok)}

.sec{margin-bottom:28px}
.sec-head{display:flex;align-items:center;gap:11px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border2)}
.sec-bar{width:5px;height:22px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.sec-title{font-size:18px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.sec-ic{font-size:18px}

/* insumos table */
.itable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.itable thead th{background:var(--bg2);text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2);padding:13px 18px}
.itable thead th.num{text-align:right}
.itable tbody td{padding:13px 18px;font-size:15px;border-top:1px solid var(--border);color:var(--ts)}
.itable tbody td.iname{color:var(--tp);font-weight:600}
.itable tbody td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.itable tbody td.unit{color:var(--tm);font-weight:600;text-transform:lowercase}
.itable tbody tr:hover td{background:rgba(249,115,22,.04)}

/* preparacion steps */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.step-n{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;box-shadow:0 4px 12px var(--ag)}
.step-c{flex:1}
.step-lbl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2);margin-bottom:4px}
.step-txt{font-size:15px;line-height:1.6;color:var(--ts)}
.step-note{margin-top:9px;font-size:13px;color:var(--warn);background:rgba(245,158,11,.1);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 8px 8px 0}
.empty-note{color:var(--tm);font-size:14px;font-style:italic;background:var(--card);border:1px dashed var(--border2);border-radius:12px;padding:20px;text-align:center}

/* emplatado */
.plate-grid{display:grid;grid-template-columns:300px 1fr;gap:22px}
@media(max-width:760px){.plate-grid{grid-template-columns:1fr}}
.plate-photo{height:240px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1a2540,#0f1729);display:grid;place-items:center;border:1px solid var(--border)}
.plate-photo img{width:100%;height:100%;object-fit:cover}
.plate-photo .ph{font-size:54px;opacity:.4}
.plate-fields{display:flex;flex-direction:column;gap:14px}
.pfield{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px}
.pfield-l{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent2);margin-bottom:5px;display:flex;align-items:center;gap:7px}
.pfield-v{font-size:14.5px;line-height:1.55;color:var(--ts)}
.pfield-v.muted{color:var(--tm);font-style:italic}

/* costos panel */
.cost-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cbox{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px}
.cbox-l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tm)}
.cbox-v{font-size:17px;font-weight:800;margin-top:4px}
.cbox.hl{background:linear-gradient(160deg,rgba(34,197,94,.12),var(--card));border-color:rgba(34,197,94,.3)}
.cbox.hl .cbox-v{color:var(--ok)}
.cbox.acc{background:linear-gradient(160deg,var(--am),var(--card));border-color:var(--ag)}
.cbox.acc .cbox-v{color:var(--accent2)}

.empty{text-align:center;padding:80px 20px;color:var(--tm)}
.empty-emoji{font-size:54px;margin-bottom:14px}
.hidden{display:none!important}
@media(max-width:880px){.sidebar{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:.25s}.sidebar.show{transform:none}.content{padding:18px}}
</style>

// Family emoji + order
const FAM_META = {
 'Cocina':{emoji:'🍳',order:1},
 'Bar':{emoji:'🍸',order:2},
 'Postres':{emoji:'🍰',order:3}
};
const CAT_EMOJI = {
 'Entradas':'🥗','Sopas':'🍲','Arroces':'🍚','Carnes':'🥩','Aves':'🍗','Mariscos':'🦐',
 'Ceviches':'🐟','Causas':'🥔','Especialidades del Chef':'👨‍🍳','Para Compartir':'🍢',
 'Menú Infantil':'🧒','Recomendados del Chef':'⭐','Almuerzos':'🍽️','Pastas':'🍝',
 'Ensaladas':'🥬','Salsas':'🥫','Bases':'🧂','Postres':'🍰','Bebidas':'🍹',
 'Cócteles':'🍸','Cervezas':'🍺','Licores':'🥃','Tortas':'🎂','Helados':'🍨'
};

// Build family -> categories index
function buildIndex(){
 const idx = {};
 RECIPES.forEach(r=>{
  const f = r.familia || 'Cocina';
  if(!idx[f]) idx[f] = {};
  if(!idx[f][r.category]) idx[f][r.category] = [];
  idx[f][r.category].push(r);
 });
 return idx;
}
let IDX = buildIndex();
let openFams = {};

function famList(){
 return Object.keys(IDX).sort((a,b)=>(FAM_META[a]?.order||9)-(FAM_META[b]?.order||9));
}
function catList(f){ return Object.keys(IDX[f]).sort(); }
function famCount(f){ let n=0; Object.values(IDX[f]).forEach(a=>n+=a.length); return n; }

// ===== Sidebar accordion =====
function buildFamNav(){
 const wrap = document.getElementById('famNav');
 wrap.innerHTML = famList().map(f=>{
  const meta = FAM_META[f]||{emoji:'📁'};
  const cats = catList(f);
  const isOpen = openFams[f];
  const catHtml = cats.map(c=>{
   return '<button class="cat" data-cat="'+enc(c)+'" data-fam="'+enc(f)+'" onclick="openCategory(\''+esc(f)+'\',\''+esc(c)+'\')">'+
     '<span class="cat-emoji">'+(CAT_EMOJI[c]||'🍽️')+'</span>'+c+
     '<span class="cat-count">'+IDX[f][c].length+'</span></button>';
  }).join('');
  return '<div class="fam">'+
   '<button class="fam-head'+(isOpen?' open':'')+'" onclick="toggleFam(\''+esc(f)+'\')">'+
    '<span class="fam-emoji">'+meta.emoji+'</span>'+f+
    '<span class="fam-count">'+cats.length+' cat</span>'+
    '<svg class="fam-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>'+
   '</button>'+
   '<div class="fam-body'+(isOpen?' open':'')+'" id="fb-'+enc(f)+'">'+catHtml+'</div>'+
  '</div>';
 }).join('');
}
function toggleFam(f){
 openFams[f] = !openFams[f];
 buildFamNav();
}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function enc(s){return String(s).replace(/"/g,'&quot;');}

// ===== Navigation state =====
function setActive(sel){
 document.querySelectorAll('.nav,.cat').forEach(e=>e.classList.remove('on'));
 if(sel) sel.classList.add('on');
}
function setCrumb(html){ document.getElementById('crumb').innerHTML = html; }

// ===== HOME (families) =====
function goHome(){
 setActive(document.getElementById('navHome'));
 setCrumb('<b>Inicio</b>');
 const c = document.getElementById('content');
 c.innerHTML = '<div class="phead"><div class="ptitle">📖 Recetario Profesional</div><div class="psub">'+RECIPES.length+' recetas · '+famList().length+' familias · selecciona una familia para explorar</div></div>'+
  '<div class="fgrid">'+famList().map(f=>{
   const meta = FAM_META[f]||{emoji:'📁'};
   const cats = catList(f);
   return '<div class="fcard" onclick="openFamily(\''+esc(f)+'\')">'+
    '<svg class="fcard-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'+
    '<div class="fcard-emoji">'+meta.emoji+'</div>'+
    '<div class="fcard-name">'+f+'</div>'+
    '<div class="fcard-meta">'+cats.length+' categorías · '+famCount(f)+' recetas</div>'+
    '<div class="fcard-cats">'+cats.slice(0,6).map(x=>'<span class="fchip">'+x+'</span>').join('')+(cats.length>6?'<span class="fchip">+'+(cats.length-6)+'</span>':'')+'</div>'+
   '</div>';
  }).join('')+'</div>';
 closeMobile();
}

// ===== FAMILY view (its categories) =====
function openFamily(f){
 if(!openFams[f]){openFams[f]=true;buildFamNav();}
 setCrumb('<b onclick="goHome()" style="cursor:pointer">Inicio</b><span class="sep">/</span><b>'+f+'</b>');
 const meta = FAM_META[f]||{emoji:'📁'};
 const cats = catList(f);
 const c = document.getElementById('content');
 c.innerHTML = '<div class="phead"><div class="ptitle">'+meta.emoji+' '+f+'</div><div class="psub">'+cats.length+' categorías · '+famCount(f)+' recetas</div></div>'+
  '<div class="fgrid">'+cats.map(cat=>{
   const recs = IDX[f][cat];
   return '<div class="fcard" onclick="openCategory(\''+esc(f)+'\',\''+esc(cat)+'\')">'+
    '<svg class="fcard-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'+
    '<div class="fcard-emoji">'+(CAT_EMOJI[cat]||'🍽️')+'</div>'+
    '<div class="fcard-name">'+cat+'</div>'+
    '<div class="fcard-meta">'+recs.length+' recetas</div>'+
   '</div>';
  }).join('')+'</div>';
 closeMobile();
}

// ===== CATEGORY view (recipes) =====
function openCategory(f,cat){
 const btn = document.querySelector('.cat[data-cat="'+enc(cat)+'"][data-fam="'+enc(f)+'"]');
 setActive(btn);
 setCrumb('<b onclick="goHome()" style="cursor:pointer">Inicio</b><span class="sep">/</span><b onclick="openFamily(\''+esc(f)+'\')" style="cursor:pointer">'+f+'</b><span class="sep">/</span><b>'+cat+'</b>');
 const recs = IDX[f][cat];
 renderRecipeGrid(cat, (CAT_EMOJI[cat]||'🍽️')+' '+cat, recs.length+' recetas', recs);
 closeMobile();
}

function renderRecipeGrid(title, bigTitle, sub, recs){
 const c = document.getElementById('content');
 c.innerHTML = '<div class="phead"><div class="ptitle">'+bigTitle+'</div><div class="psub">'+sub+'</div></div>'+
  '<div class="rgrid">'+recs.map(r=>recipeCard(r)).join('')+'</div>';
}
function recipeCard(r){
 const img = r.photos&&r.photos[0] ? '<img src="'+r.photos[0]+'" onerror="this.style.display=\'none\'">' : '<div class="ph">'+(r.emoji||'🍽️')+'</div>';
 const cpp = r.costPerPortion!=null ? '<span class="rcard-cost">'+fmtCOP(r.costPerPortion)+'</span>' : '<span></span>';
 return '<div class="rcard" onclick="openRecipe('+r.id+')">'+
  '<div class="rcard-img">'+img+'<span class="rcard-cat">'+r.category+'</span></div>'+
  '<div class="rcard-body"><div class="rcard-name">'+r.name+'</div>'+
   '<div class="rcard-foot"><span>'+r.ingredients.length+' insumos · '+(r.steps.length||0)+' pasos</span>'+cpp+'</div>'+
  '</div></div>';
}
</script><script>
// ===== FICHA TECNICA =====
function openRecipe(id){
 const r = RECIPES.find(x=>x.id===id);
 if(!r) return;
 setCrumb('<b onclick="goHome()" style="cursor:pointer">Inicio</b><span class="sep">/</span><b onclick="openFamily(\''+esc(r.familia)+'\')" style="cursor:pointer">'+r.familia+'</b><span class="sep">/</span><b onclick="openCategory(\''+esc(r.familia)+'\',\''+esc(r.category)+'\')" style="cursor:pointer">'+r.category+'</b><span class="sep">/</span><b>'+r.name+'</b>');
 const c = document.getElementById('content');
 const heroImg = r.photos&&r.photos[0] ? '<img src="'+r.photos[0]+'" onerror="this.parentNode.innerHTML=\'<div class=ph>'+(r.emoji||'🍽️')+'</div>\'">' : '<div class="ph">'+(r.emoji||'🍽️')+'</div>';
 const tiempo = r.time ? r.time+' min' : 'Por definir';
 const rend = r.yield || (r.portions?r.portions+' porción(es)':'Por definir');
 const cpp = r.costPerPortion!=null ? fmtCOP(r.costPerPortion) : '—';

 // INFO GENERAL
 let html = '<div class="ficha">'+
  '<button class="fic-back" onclick="openCategory(\''+esc(r.familia)+'\',\''+esc(r.category)+'\')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver a '+r.category+'</button>'+
  '<div class="fic-hero"><div class="fic-photo">'+heroImg+'</div>'+
   '<div class="fic-info"><h1>'+r.name+'</h1>'+
    (r.tags&&r.tags.length?'<div class="fic-tags">'+r.tags.map(t=>'<span class="fic-tag">'+t+'</span>').join('')+'</div>':'<div style="height:10px"></div>')+
    '<div class="fic-meta">'+
     metaBox('Familia',r.familia)+
     metaBox('Categoría',r.category)+
     metaBox('Rendimiento',rend)+
     metaBox('Tiempo de prep.',tiempo)+
     metaBox('Costo por porción',cpp,'cost')+
     metaBox('Insumos',r.ingredients.length+' items')+
    '</div></div></div>';

 // INSUMOS
 html += section('🧾','Insumos',
  r.ingredients.length ?
  '<table class="itable"><thead><tr><th>Insumo</th><th class="num">Cantidad</th><th class="num">Unidad de Medida</th></tr></thead><tbody>'+
   r.ingredients.map(i=>'<tr><td class="iname">'+i.name+'</td><td class="num">'+fmtQty(i.qty)+'</td><td class="num unit">'+(i.unit||'—')+'</td></tr>').join('')+
  '</tbody></table>'
  : '<div class="empty-note">No hay insumos registrados.</div>');

 // PREPARACION
 html += section('👨‍🍳','Preparación',
  r.steps&&r.steps.length ?
  '<div class="steps">'+r.steps.map(s=>'<div class="step"><div class="step-n">'+s.n+'</div><div class="step-c"><div class="step-lbl">Paso '+s.n+'</div><div class="step-txt">'+s.text+'</div>'+(s.note?'<div class="step-note">💡 '+s.note+'</div>':'')+'</div></div>').join('')+'</div>'
  : '<div class="empty-note">Preparación por definir. Agrega los pasos del procedimiento.</div>');

 // EMPLATADO
 const p = r.plating||{};
 const plImg = r.platingPhoto ? '<img src="'+r.platingPhoto+'" onerror="this.parentNode.innerHTML=\'<div class=ph>🍽️</div>\'">' : (r.photos&&r.photos[1]?'<img src="'+r.photos[1]+'">':'<div class="ph">🍽️</div>');
 html += section('🍽️','Emplatado',
  '<div class="plate-grid"><div class="plate-photo">'+plImg+'</div>'+
   '<div class="plate-fields">'+
    pfield('🎨','Descripción del montaje', p.montaje)+
    pfield('📝','Observaciones del chef', p.observaciones || r.notes)+
    pfield('🌿','Decoración sugerida', p.decoracion)+
    pfield('🌡️','Punto de salida', p.puntoSalida)+
   '</div></div>');

 // COSTOS (matriz)
 if(r.matriz){
  const m = r.matriz;
  html += section('💰','Análisis de Costos',
   '<div class="cost-grid">'+
    cbox('Costo del plato', m.costoPlato,'acc')+
    cbox('Costo + margen', m.costoMasMargen)+
    cbox('Valor de venta', m.valorVenta,'hl')+
    cbox('IPO consumo', m.ipoConsumo)+
    cbox('Valor antes IPO', m.valorAntesIpo)+
    cbox('Ganancia', m.ganancia,'hl')+
    cbox('Margen', m.margen)+
   '</div>');
 }
 html += '</div>';
 c.innerHTML = html;
 document.getElementById('main').scrollTop = 0;
 closeMobile();
}
function metaBox(l,v,cls){return '<div class="fmeta"><div class="fmeta-l">'+l+'</div><div class="fmeta-v '+(cls||'')+'">'+v+'</div></div>';}
function section(ic,title,body){return '<div class="sec"><div class="sec-head"><div class="sec-bar"></div><span class="sec-ic">'+ic+'</span><span class="sec-title">'+title+'</span></div>'+body+'</div>';}
function pfield(ic,l,v){const has=v&&String(v).trim(); return '<div class="pfield"><div class="pfield-l">'+ic+' '+l+'</div><div class="pfield-v'+(has?'':' muted')+'">'+(has?v:'Por definir')+'</div></div>';}
function cbox(l,v,cls){return '<div class="cbox '+(cls||'')+'"><div class="cbox-l">'+l+'</div><div class="cbox-v">'+(v||'—')+'</div></div>';}

// ===== ALL RECIPES =====
function showAllRecipes(){
 setActive(document.getElementById('navAll'));
 setCrumb('<b onclick="goHome()" style="cursor:pointer">Inicio</b><span class="sep">/</span><b>Todas las Recetas</b>');
 const all = RECIPES.slice().sort((a,b)=>a.name.localeCompare(b.name));
 renderRecipeGrid('all','📚 Todas las Recetas', all.length+' recetas', all);
 closeMobile();
}

// ===== SEARCH =====
function onSearch(q){
 q = q.trim().toLowerCase();
 if(!q){ goHome(); return; }
 const res = RECIPES.filter(r=>{
  if(r.name.toLowerCase().includes(q)) return true;
  if((r.familia||'').toLowerCase().includes(q)) return true;
  if((r.category||'').toLowerCase().includes(q)) return true;
  if(r.ingredients.some(i=>(i.name||'').toLowerCase().includes(q))) return true;
  return false;
 });
 setActive(null);
 setCrumb('<b onclick="goHome()" style="cursor:pointer">Inicio</b><span class="sep">/</span><b>Búsqueda: "'+q+'"</b>');
 const c = document.getElementById('content');
 if(!res.length){ c.innerHTML='<div class="empty"><div class="empty-emoji">🔍</div><div style="font-size:18px;font-weight:700;color:var(--ts)">Sin resultados</div><div style="margin-top:6px">No se encontraron recetas para "'+q+'"</div></div>'; return; }
 c.innerHTML = '<div class="phead"><div class="ptitle">🔍 Resultados</div><div class="psub">'+res.length+' recetas para "'+q+'"</div></div><div class="rgrid">'+res.map(r=>recipeCard(r)).join('')+'</div>';
}

// ===== HELPERS =====
function fmtCOP(n){ if(n==null) return '—'; return '$'+Math.round(n).toLocaleString('es-CO'); }
function fmtQty(q){ if(q==null) return '—'; return (Math.round(q*100)/100).toLocaleString('es-CO'); }
function closeMobile(){ document.getElementById('sidebar').classList.remove('show'); }

// ===== INIT =====
function init(){
 document.getElementById('nbAll').textContent = RECIPES.length;
 buildFamNav();
 goHome();
}
init();
</script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocoto · Recetario Digital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --green:#2e4a32;--green2:#3c5f41;--green3:#22381f;--accent:#7fae6c;
 --bg:#f4f3ee;--card:#ffffff;--cream:#f9efee;--pink:#f7e9e7;
 --border:#e4e2da;--border2:#d4d1c6;
 --tp:#2b2b26;--ts:#5d5c52;--tm:#94927f;
 --ok:#3e7a47;--badge:#4d6b52;
 --sw:268px
}
html,body{height:100%}
body{font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tp);-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9c6b8;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--green2)}
a{color:inherit;text-decoration:none}
.shell{display:flex;height:100vh;overflow:hidden}

/* ===== SIDEBAR (verde oscuro) ===== */
.sidebar{width:var(--sw);min-width:var(--sw);background:linear-gradient(180deg,#243d28,#1c3020);color:#e8ece4;display:flex;flex-direction:column;height:100vh}
.slogo{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.slogo-icon{width:42px;height:42px;border-radius:11px;background:#f1efe6;display:grid;place-items:center;font-size:22px}
.slogo-name{font-size:19px;font-weight:800;letter-spacing:-.3px;color:#fff;line-height:1.1}
.slogo-sub{font-size:9.5px;font-weight:700;letter-spacing:1.4px;color:#a9bda6;text-transform:uppercase}
.snav-scroll{flex:1;overflow-y:auto;padding:4px 12px 24px}
.snav-scroll::-webkit-scrollbar-thumb{background:#3c5a40}
.nav{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:none;background:transparent;color:#d6ddd1;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;transition:.15s;font-family:inherit;text-align:left}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:rgba(255,255,255,.14);color:#fff}
.nav-ic{font-size:15px}
.nbadge{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);color:#eaf0e6;padding:2px 9px;border-radius:20px}
.ssec-label{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8fa78c;padding:16px 12px 5px}
.cat{width:100%;display:flex;align-items:center;gap:9px;padding:8px 12px;border:none;background:transparent;color:#cfd8ca;font-size:13.5px;font-weight:500;border-radius:9px;cursor:pointer;transition:.13s;font-family:inherit;text-align:left}
.cat:hover{background:rgba(255,255,255,.08);color:#fff}
.cat.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.cat-emoji{font-size:14px;width:18px;text-align:center}
.cat-count{margin-left:auto;font-size:10.5px;font-weight:700;color:#e7eee3;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:20px}

/* ===== MAIN ===== */
.main{flex:1;height:100vh;overflow-y:auto;background:var(--bg)}
.statusbar{display:flex;align-items:center;gap:8px;padding:8px 30px;font-size:12px;color:var(--tm);background:#eceae2;border-bottom:1px solid var(--border)}
.statusdot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.content{padding:26px 30px 40px}
.phead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.ptitle{font-size:30px;font-weight:800;letter-spacing:-.7px;color:#33322b}
.psub{font-size:13.5px;color:var(--tm);margin-top:4px}
.searchwrap{position:relative;max-width:640px;margin-bottom:24px}
.searchwrap input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:12px 16px 12px 42px;color:var(--tp);font-size:14px;font-family:inherit;outline:none;transition:.15s}
.searchwrap input:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(60,95,65,.12)}
.searchwrap .sic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--tm)}

/* recipe cards grid */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(40,50,35,.06)}
.rcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(40,50,35,.13);border-color:var(--green2)}
.rcard-img{height:160px;background:#7d8576;display:grid;place-items:center;position:relative;overflow:hidden}
.rcard-img.empty{background:#eceadf}
.rcard-img img{width:100%;height:100%;object-fit:cover}
.rcard-img .ph{font-size:40px;opacity:.85;display:flex;flex-direction:column;align-items:center;gap:8px}
.rcard-img .ph small{font-size:10px;font-weight:700;letter-spacing:1.4px;color:#9a988a}
.rcard-body{padding:13px 16px 14px;background:#fbfaf5;border-top:1px solid var(--border)}
.rcard-cat{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--badge)}
.rcard-name{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.3;margin-top:3px;text-transform:uppercase;color:#34332c}
.rcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--tm);font-weight:600}
.rcard-foot b{color:var(--ts);font-weight:700}
.empty{text-align:center;padding:80px 20px;color:var(--tm)}
.empty-emoji{font-size:54px;margin-bottom:14px}

/* ===== MODAL (ficha técnica) ===== */
.overlay{position:fixed;inset:0;background:rgba(20,28,18,.55);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:680px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column;max-height:calc(100vh - 68px)}
.modal-head{background:var(--green);color:#fff;padding:18px 24px 16px;position:relative;flex-shrink:0}
.modal-cat{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#bcd2b4}
.modal-title{font-size:22px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;margin-top:3px;padding-right:40px}
.modal-x{position:absolute;top:16px;right:18px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.modal-x:hover{background:rgba(255,255,255,.32)}
.modal-body{overflow-y:auto;padding:0 0 26px}
.modal-photo{background:var(--pink);display:grid;place-items:center;padding:24px}
.modal-photo .frame{width:220px;height:210px;background:#9aa093;border-radius:4px;display:grid;place-items:center;overflow:hidden}
.modal-photo .frame img{width:100%;height:100%;object-fit:cover}
.modal-photo .frame .ph{font-size:64px}
.msec{padding:20px 26px 0}
.msec-title{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#3c3b33;border-bottom:2px solid var(--border);padding-bottom:7px;margin-bottom:4px}
/* ingredientes table */
.itable{width:100%;border-collapse:collapse}
.itable thead th{text-align:left;font-size:12.5px;font-weight:700;color:#6b6a5e;padding:10px 6px;border-bottom:1px solid var(--border)}
.itable thead th.num{text-align:right}
.itable tbody td{padding:11px 6px;font-size:13.5px;border-bottom:1px solid #efeee6;color:#3a392f}
.itable tbody td.iname{font-weight:700;text-transform:uppercase;font-size:12.5px}
.itable tbody td.unit{color:var(--tm)}
.itable tbody td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.itable tbody tr:last-child td{border-bottom:none}
/* pasos */
.steps{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.step{display:flex;gap:13px;align-items:flex-start}
.step-n{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.step-txt{font-size:14px;line-height:1.55;color:#3a392f;padding-top:4px}
.step-note{margin-top:5px;font-size:12.5px;color:#8a6d1f;background:#faf3df;border-left:3px solid #d9b44a;padding:7px 11px;border-radius:0 8px 8px 0}
.empty-note{color:var(--tm);font-size:13px;font-style:italic;padding:14px 4px}
@media(max-width:880px){
 .sidebar{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:.25s}
 .sidebar.show{transform:none}
 .content{padding:18px}
}
</style>

</script><script>
// ====== Metadatos de familias (secciones del sidebar) ======
const FAM_META = {
 'Cocina':  {label:'Cocina', order:1},
 'Postres': {label:'Postres', order:2},
 'Bar':     {label:'Cócteles & Bebidas', order:3},
 'Sub Recetas': {label:'Especial', order:4}
};
const CAT_EMOJI = {
 'Entradas':'🥟','Carnes':'🥩','Ceviches':'🐟','Causas':'🥔','Mariscos':'🦐','Aves':'🍗',
 'Especialidades del Chef':'👨‍🍳','Recomendados del Chef':'⭐','Arroces':'🍚','Sopas':'🍲',
 'Para Compartir':'🍢','Menú Infantil':'🧒','Almuerzos':'🍽️','Postres':'🍰',
 'Bebidas':'🥤','Cócteles':'🍸','Cócteles de Pisco':'🍹','Tragos':'🥃','Gin & Tonic':'🍸',
 'Sangrías':'🍷','Aperitivos y Digestivos':'🥂','Tequila y Mezcal':'🌵','Vodka':'🍸',
 'Whisky':'🥃','Ron':'🥃','Aguardiente':'🥃','Pisco':'🍶','Ginebra':'🍸',
 'Vinos Tintos':'🍷','Vinos Blancos':'🥂','Vinos por Copa':'🍷','Vino Rosado':'🌸',
 'Espumosos':'🍾','Cervezas':'🍺','Bebidas sin Alcohol':'🥤','Limonadas y Jugos':'🍋',
 'Aguas y Embotellados':'💧',
 'Sub recetas cocina':'🥣','Sub recetas bar':'🧉'
};

// ====== Índice familia -> categoría -> recetas ======
const IDX = {};
RECIPES.forEach(r=>{
 const f = r.familia || 'Otros';
 const c = r.category || 'General';
 (IDX[f] = IDX[f] || {});
 (IDX[f][c] = IDX[f][c] || []).push(r);
});
function famList(){
 return Object.keys(IDX).sort((a,b)=>(FAM_META[a]?.order||9)-(FAM_META[b]?.order||9));
}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function enc(s){return String(s).replace(/"/g,'&quot;');}

// ====== Sidebar ======
function buildSidebar(){
 document.getElementById('nbAll').textContent = RECIPES.length;
 const wrap = document.getElementById('famNav');
 wrap.innerHTML = famList().map(f=>{
  const meta = FAM_META[f]||{label:f};
  const cats = Object.keys(IDX[f]).sort((a,b)=>a.localeCompare(b,'es'));
  const catHtml = cats.map(c=>
   '<button class="cat" data-cat="'+enc(c)+'" data-fam="'+enc(f)+'" onclick="openCategory(\''+esc(f)+'\',\''+esc(c)+'\')">'+
    '<span class="cat-emoji">'+(CAT_EMOJI[c]||'🍽️')+'</span>'+c+
    '<span class="cat-count">'+IDX[f][c].length+'</span></button>'
  ).join('');
  return '<div class="ssec-label">'+meta.label+'</div>'+catHtml;
 }).join('');
}
function setActive(sel){
 document.querySelectorAll('.nav,.cat').forEach(e=>e.classList.remove('on'));
 if(sel) sel.classList.add('on');
}

// ====== Vistas ======
let currentList = RECIPES;
function showAllRecipes(){
 currentList = RECIPES;
 setActive(document.getElementById('navAll'));
 document.getElementById('pageTitle').textContent = 'Todas las Recetas';
 document.getElementById('pageSub').textContent = RECIPES.length+' recetas';
 document.getElementById('searchInput').value = '';
 renderGrid(RECIPES);
}
function openCategory(f,cat){
 currentList = IDX[f][cat];
 const btn = document.querySelector('.cat[data-cat="'+enc(cat)+'"][data-fam="'+enc(f)+'"]');
 setActive(btn);
 document.getElementById('pageTitle').textContent = cat;
 document.getElementById('pageSub').textContent = currentList.length+' recetas · '+(FAM_META[f]?.label||f);
 document.getElementById('searchInput').value = '';
 renderGrid(currentList);
}
function renderGrid(recs){
 const g = document.getElementById('grid');
 if(!recs.length){
  g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-emoji">🍽️</div>No se encontraron recetas</div>';
  return;
 }
 g.innerHTML = recs.map(r=>{
  const hasImg = r.photos && r.photos[0] && String(r.photos[0]).length>4;
  const img = hasImg
   ? '<img src="'+r.photos[0]+'" onerror="this.parentNode.classList.add(\'empty\');this.remove()">'
   : '<div class="ph">'+(r.emoji||'🌿')+'<small>'+String(r.category||'').toUpperCase()+'</small></div>';
  return '<div class="rcard" onclick="openRecipe('+r.id+')">'+
   '<div class="rcard-img'+(hasImg?'':' empty')+'">'+img+'</div>'+
   '<div class="rcard-body">'+
    '<div class="rcard-cat">'+r.category+'</div>'+
    '<div class="rcard-name">'+r.name+'</div>'+
    '<div class="rcard-foot"><span><b>'+r.ingredients.length+'</b> ingredientes</span><span><b>'+(r.steps?r.steps.length:0)+'</b> pasos</span></div>'+
   '</div></div>';
 }).join('');
}

// ====== Búsqueda ======
function onSearch(q){
 q = q.trim().toLowerCase();
 if(!q){ renderGrid(currentList); return; }
 const res = RECIPES.filter(r=>
  r.name.toLowerCase().includes(q) ||
  (r.category||'').toLowerCase().includes(q) ||
  (r.familia||'').toLowerCase().includes(q) ||
  r.ingredients.some(i=>i.name.toLowerCase().includes(q))
 );
 document.getElementById('pageTitle').textContent = 'Resultados';
 document.getElementById('pageSub').textContent = res.length+' recetas para "'+q+'"';
 renderGrid(res);
}

// ====== MODAL FICHA ======
function openRecipe(id){
 const r = RECIPES.find(x=>x.id===id);
 if(!r) return;
 document.getElementById('mCat').textContent = (r.category||'').toUpperCase();
 document.getElementById('mTitle').textContent = r.name;

 const hasImg = r.photos && r.photos[0] && String(r.photos[0]).length>4;
 const photo = '<div class="modal-photo"><div class="frame">'+
  (hasImg ? '<img src="'+r.photos[0]+'">' : '<div class="ph">'+(r.emoji||'🍽️')+'</div>')+
 '</div></div>';

 // Ingredientes
 const ingRows = r.ingredients.map(i=>
  '<tr><td class="iname">'+i.name+'</td><td class="unit">'+(i.unit||'')+'</td><td class="num">'+i.qty+'</td></tr>'
 ).join('');
 const ingredientes = '<div class="msec"><div class="msec-title">Ingredientes</div>'+
  '<table class="itable"><thead><tr><th>Artículo</th><th>Unidad de Medida</th><th class="num">Cantidad</th></tr></thead>'+
  '<tbody>'+ingRows+'</tbody></table></div>';

 // Preparación
 let prepHtml;
 if(r.steps && r.steps.length){
  prepHtml = '<div class="steps">'+r.steps.map((s,i)=>
   '<div class="step"><div class="step-n">'+(s.n||i+1)+'</div><div><div class="step-txt">'+(s.n||i+1)+'. '+s.text+'</div>'+
   (s.note?'<div class="step-note">💡 '+s.note+'</div>':'')+'</div></div>'
  ).join('')+'</div>';
 }else{
  prepHtml = '<div class="empty-note">Pasos de preparación por definir.</div>';
 }
 const preparacion = '<div class="msec"><div class="msec-title">Preparación</div>'+prepHtml+'</div>';

 // Emplatado (montaje / decoración / observaciones / punto de salida)
 const p = r.plating||{};
 const plateSteps = [];
 if(p.montaje) plateSteps.push(p.montaje);
 if(p.decoracion) plateSteps.push(p.decoracion);
 if(p.observaciones) plateSteps.push(p.observaciones);
 if(p.puntoSalida) plateSteps.push(p.puntoSalida);
 let plateHtml;
 if(plateSteps.length){
  plateHtml = '<div class="steps">'+plateSteps.map((t,i)=>
   '<div class="step"><div class="step-n">'+(i+1)+'</div><div class="step-txt">'+(i+1)+'. '+t+'</div></div>'
  ).join('')+'</div>';
 }else{
  plateHtml = '<div class="empty-note">Emplatado por definir.</div>';
 }
 const emplatado = '<div class="msec"><div class="msec-title">Emplatado</div>'+plateHtml+'</div>';

 // Notas / chef
 let notas = '';
 if(r.notes || r.chef){
  notas = '<div class="msec"><div class="msec-title">Notas</div><div class="steps">'+
   (r.notes?'<div class="step-txt">📝 '+r.notes+'</div>':'')+
   (r.chef?'<div class="step-note">👨‍🍳 Tip del chef: '+r.chef+'</div>':'')+
  '</div></div>';
 }

 document.getElementById('mBody').innerHTML = photo + ingredientes + preparacion + emplatado + notas;
 document.getElementById('overlay').classList.add('show');
 document.body.style.overflow='hidden';
}
function closeModal(){
 document.getElementById('overlay').classList.remove('show');
 document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

// ====== Init ======
buildSidebar();
showAllRecipes();
document.getElementById('statusTxt').textContent = RECIPES.length+' recetas cargadas · '+new Date().toLocaleTimeString('es-CO');
</script>
</body>
</html>
